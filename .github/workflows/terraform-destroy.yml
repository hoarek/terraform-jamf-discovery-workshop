name: "Terraform Destroy"

# Manually triggered to clean up a previously applied workshop environment.
# Requires the state artifact from the central modular_onboarder workflow run
# that performed the apply; that artifact has 1-day retention, so this must
# run on the same day as the apply.
#
# Inputs:
#   environment  — the GitHub Environment created by the onboarder (same name
#                  used when the apply ran; holds tf_vars and credentials)
#   apply_run_id — numeric run ID of the central modular_onboarder workflow
#                  run that applied the state. Find it in the Actions tab URL:
#                  https://github.com/jamf/modular_onboarder/actions/runs/<id>

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment to use (same as the apply run)"
        required: true
      apply_run_id:
        description: "Run ID of the central workflow apply run to pull state from"
        required: true

jobs:
  destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      TF_CLI_ARGS_init: "-no-color -compact-warnings"
      TF_CLI_ARGS_destroy: "-no-color -compact-warnings"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Write tfvars
        run: |
          echo "${{ secrets.tf_vars }}" | base64 --decode > ./tfvars.auto.tfvars.json
          echo "tfvars written ($(jq -r 'keys | length' ./tfvars.auto.tfvars.json) keys)"

      - name: Download state from apply run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ github.event.inputs.apply_run_id }}" \
            --repo jamf/modular_onboarder \
            --name terraform-state \
            --dir ./state-download
          cp ./state-download/terraform.tfstate ./terraform.tfstate
          echo "State downloaded: $(wc -c < ./terraform.tfstate) bytes"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "~1.12"
          tofu_wrapper: false

      - name: Init
        run: tofu init

      - name: Destroy
        env:
          JAMFPLATFORM_CLIENT_ID: ${{ secrets.jamfplatform_client_id }}
          JAMFPLATFORM_CLIENT_SECRET: ${{ secrets.jamfplatform_client_secret }}
          JAMFPLATFORM_BASE_URL: ${{ secrets.jamfplatform_base_url }}
          JAMFPLATFORM_TENANT_ID: ${{ secrets.jamfplatform_tenant_id }}
        run: |
          JAMFPLATFORM_CLIENT_ID=$(echo "$JAMFPLATFORM_CLIENT_ID" | base64 --decode)
          JAMFPLATFORM_CLIENT_SECRET=$(echo "$JAMFPLATFORM_CLIENT_SECRET" | base64 --decode)
          JAMFPLATFORM_BASE_URL=$(echo "$JAMFPLATFORM_BASE_URL" | base64 --decode)
          JAMFPLATFORM_TENANT_ID=$(echo "$JAMFPLATFORM_TENANT_ID" | base64 --decode)

          [[ -n "$JAMFPLATFORM_BASE_URL" ]]    && echo "::add-mask::$JAMFPLATFORM_BASE_URL"
          [[ -n "$JAMFPLATFORM_CLIENT_ID" ]]   && echo "::add-mask::$JAMFPLATFORM_CLIENT_ID"
          [[ -n "$JAMFPLATFORM_CLIENT_SECRET" ]] && echo "::add-mask::$JAMFPLATFORM_CLIENT_SECRET"
          [[ -n "$JAMFPLATFORM_TENANT_ID" ]]   && echo "::add-mask::$JAMFPLATFORM_TENANT_ID"

          export JAMFPLATFORM_CLIENT_ID JAMFPLATFORM_CLIENT_SECRET \
                 JAMFPLATFORM_BASE_URL JAMFPLATFORM_TENANT_ID

          tofu destroy \
            -auto-approve \
            -parallelism=1 \
            -var-file="./tfvars.auto.tfvars.json"

      - name: Upload cleared state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-post-destroy
          path: ./terraform.tfstate*
          retention-days: 7
